echo Executing Server Config...

# --- Netzwerk ---------------------------------------------------------------
lanmode 0
port 7777
maxplayers 700
bind
query 1

# --- Passwoerter ------------------------------------------------------------
# rcon_password UNBEDINGT vor dem ersten Start aendern.
password
rcon_password CHANGE_ME_BEFORE_FIRST_START
rcon 1

# --- Serverkennung ----------------------------------------------------------
hostname Jebiga-Gaming
gamemode0 jebiga 1
weburl jebiga-gaming.net
language German / English

# --- Filterscripts und Plugins ---------------------------------------------
# Diese Datei ist fuer Windows vorbereitet. Unter Linux heissen die Plugins
# .so statt .dll - setup.sh stellt das beim ersten Lauf automatisch um.
#
#   streamer     Objekte, Textlabels und Map-Icons jenseits der SA-MP-Grenzen
#   sscanf       Parameterzerlegung (vom Gamemode nicht benoetigt, aber
#                fuer eigene Filterscripts nuetzlich)
#   crashdetect  Zeigt bei Laufzeitfehlern Datei und Zeilennummer statt nur
#                einer Speicheradresse - beim Einfahren eines Servers das
#                wertvollste Plugin ueberhaupt
#   mysql        nur noetig, wenn in scriptfiles/mysql.ini ein User steht
plugins streamer.dll crashdetect.dll sscanf.dll

filterscripts gates lottery weathercycle speedcam

# --- Verhalten --------------------------------------------------------------
announce 1
chatlogging 1
onfoot_rate 40
incar_rate 40
weapon_rate 40
stream_distance 300.0
stream_rate 1000
maxnpc 0
sleep 5
timestamp 1

# --- Dateien ----------------------------------------------------------------
logtimeformat [%H:%M:%S]
output 1
