echo Executing Server Config...

# --- Netzwerk ---------------------------------------------------------------
lanmode 0
port 7777
maxplayers 700
bind
query 1

# --- Passwoerter ------------------------------------------------------------
# rcon_password UNBEDINGT vor dem ersten Start aendern.
password
rcon_password CHANGE_ME_BEFORE_FIRST_START
rcon 1

# --- Serverkennung ----------------------------------------------------------
hostname UIF - United Islands Freeroam
gamemode0 uif 1
weburl uifserver.net
language German / English

# --- Filterscripts und Plugins ---------------------------------------------
# Einziges Plugin ist der Streamer; er traegt die Custom Map.
# setup.sh baut streamer.so nach plugins/.
filterscripts
plugins streamer.so

# --- Verhalten --------------------------------------------------------------
announce 1
chatlogging 1
onfoot_rate 40
incar_rate 40
weapon_rate 40
stream_distance 300.0
stream_rate 1000
maxnpc 0
sleep 5
timestamp 1

# --- Dateien ----------------------------------------------------------------
logtimeformat [%H:%M:%S]
output 1
